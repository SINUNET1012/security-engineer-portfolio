---
- name: Ping 테스트 및 실패 장비 목록 나열
  hosts: all
  gather_facts: no
  connection: local

  tasks:
    - name: 장비로 Ping 전송
      ansible.builtin.command:
        cmd: ping -c 3 -W 1 {{ ansible_host }}
      register: ping_result
      ignore_errors: yes

    - name: Ping 실패 장비 표시
      ansible.builtin.debug:
        msg: "[FAILED] {{ inventory_hostname }} ({{ ansible_host }})"
      when: ping_result.rc != 0
